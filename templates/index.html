<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Reflection AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .journal-card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #resultArea { display: none; } /* Hidden until content is loaded */

    </style>
</head>
<body>



<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
{% if not journaling_idea %}
            <div class="card journal-card border-0 mb-4">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Ai Journaling Idea Generator</h2>
                    <p class="text-center"> "Generate journaling idea based on what's happening on your life today."</p>

                    <form id="journalForm" method="POST">
                        <div class="mb-3">
                            <label for="statement_1" class="form-label fw-bold">What was the best part of your day?</label>
                            <input type="text" class="form-control" id="statement_1" name="statement_1" placeholder="e.g. Having coffee with an old friend" required>
                        </div>

                        <div class="mb-3">
                            <label for="statement_2" class="form-label fw-bold">What kept you busy today?</label>
                            <input type="text" class="form-control" id="statement_2" name="statement_2" placeholder="e.g. Debugging a tricky API route" required>
                        </div>

                        <div class="mb-3">
                            <label for="statement_3" class="form-label fw-bold">How are you feeling tonight?</label>
                            <select class="form-select" id="statement_3" name="statement_3" required>
                                <option value="" selected disabled>Choose your mood...</option>
                                <option value="up">Feeling Up</option>
                                <option value="down">Feeling Down</option>
                                <option value="neutral">Somewhere in between</option>
                            </select>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Generate Ideas</button>
                        </div>
                    </form>
                </div>
            </div>
{% else %}

            <div class="card journal-card border-0 bg-white">
                <div class="card-body p-4">
                    <h4 class="card-title text-primary mb-3">Your Journaling Prompts</h4>
                    <hr>
                    <div id="aiResponse" class="lh-lg">
                        {{ journaling_idea | safe }}
                        </div>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm mt-3">Start Over</a>
                </div>
            </div>
{% endif %}
        </div>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
