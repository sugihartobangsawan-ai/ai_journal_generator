<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Reflection AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .journal-card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        #resultArea { display: none; }
        .hover-opacity-100:hover { opacity: 1 !important; color: #0d6efd !important; }
    </style>
</head>

<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                {% if not journaling_idea %}
                <div class="card journal-card border-0 mb-4">
                    <div class="card-body p-4">
                        <!-- Header Section -->
                        <div class="text-center mb-4">
                            <h2 class="mb-1">AI Journaling Idea Generator</h2>

                            <div class="mb-3">
                                <a href="{{ url_for('index') }}" class="text-decoration-none small text-muted d-inline-flex align-items-center opacity-75 hover-opacity-100">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-arrow-clockwise me-1" viewBox="0 0 16 16">
                                        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z" />
                                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466" />
                                    </svg>
                                    Refresh Questions
                                </a>
                            </div>

                            <p class="text-secondary mb-0 small">"Generate journaling ideas based on what's happening in your life today."</p>
                        </div>

                        <!-- Form Section -->
                        <form id="journalForm" method="POST">
                            <input type="hidden" name="q1" value="{{ selected_questions[0] }}">
                            <input type="hidden" name="q2" value="{{ selected_questions[1] }}">
                            <input type="hidden" name="q3" value="{{ selected_questions[2] }}">

                            <div class="mb-3">
                                <label for="statement_1" class="form-label fw-bold">{{ selected_questions[0] }}</label>
                                <input type="text" class="form-control" id="statement_1" name="statement_1" placeholder="e.g. Having coffee with an old friend" required>
                            </div>

                            <div class="mb-3">
                                <label for="statement_2" class="form-label fw-bold">{{ selected_questions[1] }}</label>
                                <input type="text" class="form-control" id="statement_2" name="statement_2" placeholder="e.g. Debugging a tricky API route" required>
                            </div>

                            <div class="mb-3">
                                <label for="statement_3" class="form-label fw-bold">{{ selected_questions[2] }}</label>
                                <input type="text" class="form-control" id="statement_3" name="statement_3" placeholder="e.g. Learning a new skill" required>
                            </div>

                            <div class="mb-3">
                                <label for="statement_4" class="form-label fw-bold">How are you feeling tonight?</label>
                                <select class="form-select" id="statement_4" name="statement_4" required>
                                    <option value="" selected disabled>Choose your mood...</option>
                                    <option value="up">Feeling Up</option>
                                    <option value="down">Feeling Down</option>
                                    <option value="neutral">Somewhere in between</option>
                                </select>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Generate Ideas</button>
                            </div>
                        </form>
                    </div>
                </div>

                {% else %}
                <!-- Response Section -->
                <div class="card journal-card border-0 bg-white">
                    <div class="card-body p-4">
                        <h4 class="card-title text-primary mb-3">Your Journaling Prompts</h4>
                        <hr>
                        <div id="aiResponse" class="lh-lg">
                            {{ journaling_idea | safe }}
                        </div>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm mt-3">Start Over</a>
                    </div>
                </div>
                {% endif %}

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
